<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Story Canvas">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Freeform-style canvas for planning and worldbuilding fiction, with Apple Pencil support.">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f7;--panel:#ffffff;--panel2:#eef0f4;--text:#1b1f27;--muted:#677084;--line:#d3d8e0;
  --accent:#3463f0;--accent-soft:rgba(52,99,240,.14);--head:#e8ecf4;--card:#ffffff;--link:#6b7a90;
  --ink:#1b1f27;--dot:rgba(0,0,0,.2);--danger:#d33a3a;--shadow:0 6px 24px rgba(15,20,35,.18);
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1117;--panel:#1a1f29;--panel2:#242b37;--text:#e7eaf0;--muted:#9aa4b5;--line:#2f3745;
  --accent:#7fa3ff;--accent-soft:rgba(127,163,255,.2);--head:#2a3342;--card:#1c222d;--link:#8fa1ba;
  --ink:#f3f4f6;--dot:rgba(255,255,255,.22);--danger:#ff7a7a;--shadow:0 6px 24px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit}
svg{display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{min-height:32px;padding:0 10px;font-size:14px}
.ibtn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn:active{background:var(--accent-soft)}

/* home */
#home{overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 28px) calc(var(--sal) + 20px)}
.home-in{width:100%;max-width:760px;margin:0 auto}
.home-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.home-head h1{margin:0;font-size:28px;flex:1;min-width:180px;letter-spacing:-.02em}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.notice b{display:block;margin-bottom:2px}
.notice.warn{background:rgba(220,140,30,.15);border-color:#d98a1e}
.projlist{display:flex;flex-direction:column;gap:10px}
.proj{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;min-height:68px}
.proj-main{flex:1;min-width:0;text-align:left;padding:8px 0}
.proj-name{font-weight:650;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-meta{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.foot{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}

/* editor toolbar */
#toolbar{flex:none;display:flex;align-items:center;gap:2px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:30;touch-action:pan-x}
#toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
#pname{font-weight:650;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;height:40px;border-radius:10px;flex:none}
#savestat{font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap;margin-left:auto;flex:none}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:block}
#searchbar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px);z-index:29;position:relative}
#searchbar input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;outline:none}
#results{position:absolute;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);top:100%;max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:4px}
.res{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res b{display:block}.res small{color:var(--muted)}

/* viewport */
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;touch-action:none;background:var(--bg);-webkit-user-select:none;user-select:none;cursor:default}
#viewport.t-pen,#viewport.t-highlighter,#viewport.t-lasso{cursor:crosshair}
#viewport.t-eraser{cursor:cell}
#ink{position:absolute;left:0;top:0;pointer-events:none}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#cards{position:absolute;left:0;top:0}
.linkhit{pointer-events:stroke;cursor:pointer}
#selbox{position:absolute;border:2px dashed var(--accent);background:var(--accent-soft);pointer-events:none;z-index:100000;border-radius:6px}

/* cards */
.card{position:absolute;left:0;top:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.14);display:flex;flex-direction:column;transform-origin:0 0;color:var(--text)}
.card.selected{outline:2px solid var(--accent);outline-offset:2px}
.card.dim{opacity:.22}
.card.linktarget{outline:3px solid #2fb86b;outline-offset:3px}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,60%{outline:4px solid var(--accent);outline-offset:4px}100%{outline:4px solid transparent}}
.card-head{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;background:var(--head);border-radius:11px 11px 0 0;cursor:grab;touch-action:none}
.card.collapsed .card-head{border-radius:11px}
.card-head.colored{color:#1b1f27}
.card-head.colored .tplname{color:rgba(27,31,39,.65)}
.card-title{flex:1;min-width:0;pointer-events:none}
.tplname{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);line-height:1.1}
.ttl{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.chbtn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chbtn:active{background:rgba(0,0,0,.12)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px 0}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.card-body{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:8px 12px 14px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card.collapsed .card-body,.card.collapsed .tagrow,.card.collapsed .resize,.card.collapsed .cink{display:none}
.field{display:block;margin-bottom:9px}
.field>span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.field input[type=text],.field textarea,.field select{width:100%;font-size:16px;line-height:1.35;color:var(--text);background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:6px 8px;resize:none;outline:none;display:block;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.field textarea{overflow:hidden;min-height:56px}
.field select{background-image:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.imgf{display:flex;flex-direction:column;gap:6px}
.imgf img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:block}
.imgf .row{display:flex;gap:6px}
.cink{position:absolute;left:0;top:0;pointer-events:none;border-radius:12px;z-index:5}
.handle{position:absolute;right:-15px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.5;touch-action:none;cursor:crosshair;z-index:6}
.card.selected .handle,.card:hover .handle{opacity:1}
.resize{position:absolute;right:0;bottom:0;width:30px;height:30px;touch-action:none;cursor:nwse-resize;z-index:6;display:flex;align-items:flex-end;justify-content:flex-end;padding:5px;color:var(--muted)}
.frame{background:var(--fbg,rgba(120,135,160,.13));border:2px dashed var(--fbd,var(--line));border-radius:18px;box-shadow:none}
.frame .card-head{height:44px;background:transparent;padding-left:6px}
.frame .grip{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.frame .ftitle{flex:1;min-width:0;background:transparent;border:0;outline:0;font-weight:650;font-size:16px;color:var(--text);padding:4px 6px;border-radius:6px;-webkit-user-select:text;user-select:text}
.frame .ftitle:focus{background:var(--panel2)}
.frame .handle{display:none}
.tool-draw .card input,.tool-draw .card textarea,.tool-draw .card select,.tool-draw .card .imgf button,.tool-draw .card .imgf img{pointer-events:none}

/* overlays */
#fab{position:absolute;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 18px);height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:20}
#zoomctl{position:absolute;left:calc(var(--sal) + 14px);bottom:calc(var(--sab) + 18px);display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20}
#zoomctl .ibtn{width:38px;height:38px}
#zlabel{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
#selbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 70px);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;box-shadow:var(--shadow);z-index:25;font-size:14px}
#popover{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-width:min(360px,92vw);max-height:80vh;overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;min-height:42px}
.mi:active,.mi:hover{background:var(--accent-soft)}
.mi.danger{color:var(--danger)}
.mi .chk{margin-left:auto;color:var(--accent)}
.mi small{color:var(--muted);margin-left:auto}
.mdiv{height:1px;background:var(--line);margin:4px 6px}
.pop-pad{padding:8px 10px}
.pop-pad label{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
.pop-pad input[type=text]{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 10px;font-size:16px;outline:none}
.pop-pad input[type=range]{width:100%}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px;font-size:14px;background:var(--panel2)}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 6px 3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.sel{background:var(--accent);color:#fff}
#modalwrap{position:fixed;inset:0;z-index:2000;background:rgba(10,14,22,.5);display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px 16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:100%;display:flex;flex-direction:column}
.modal.wide{max-width:640px}
.modal h2{margin:0;padding:16px 18px 6px;font-size:19px}
.modal .mbody{padding:6px 18px 12px;overflow:auto;flex:1;min-height:0}
.modal .mact{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px 14px;flex-wrap:wrap}
.modal input[type=text]{width:100%;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;outline:none;font-size:16px}
.modal select{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 8px;font-size:15px}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0;font-weight:600}
.frow{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.frow input[type=text]{flex:2;min-width:110px;height:38px}
.frow .opts{flex-basis:100%;height:34px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);background:#222a38;color:#fff;padding:10px 16px;border-radius:12px;z-index:3000;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center}

</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen"></section>
  <section id="editor" class="screen" hidden>
    <header id="toolbar"></header>
    <div id="searchbar" hidden>
      <input id="q" type="search" placeholder="Search cards…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search cards">
      <div id="results" hidden></div>
    </div>
    <div id="viewport">
      <canvas id="ink"></canvas>
      <div id="world">
        <svg id="links" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--link)"/></marker>
          </defs>
          <g id="linkg"></g>
        </svg>
        <div id="cards"></div>
        <div id="selbox" hidden></div>
      </div>
    </div>
    <div id="selbar" hidden></div>
    <div id="zoomctl"></div>
    <button id="fab" aria-label="Add card"></button>
  </section>
  <div id="popover" hidden></div>
  <div id="modalwrap" hidden></div>
  <div id="toast" hidden></div>
</div>

<script>
'use strict';
(() => {
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return e;
};
const uid = () => (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const fmtDate = t => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });

const ICONS = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  select: '<path d="M5 3l14 8-6.5 1.5L10 19z"/>',
  pen: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z"/><path d="M14 7l3 3"/>',
  hl: '<path d="M9 4l11 11-5 5L4 9z"/><path d="M4 21h8"/>',
  eraser: '<path d="M4 15l8-9 8 8-5 5H8z"/><path d="M9 11l7 7"/>',
  lasso: '<ellipse cx="12" cy="10" rx="9" ry="6" stroke-dasharray="3 2.5"/><path d="M9 15c0 3 1.5 5 4.5 5"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-4"/>',
  redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
  more: '<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  chevdown: '<path d="M6 9l6 6 6-6"/>',
  chevright: '<path d="M9 6l6 6-6 6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  grip: '<circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="17" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="1.4" fill="currentColor" stroke="none"/>',
  corner: '<path d="M14 4L4 14M14 9L9 14"/>',
};
const icon = (n, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

let toastTimer = 0;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

/* ============ storage (IndexedDB) ============ */
const DB_NAME = 'story-canvas', DB_VER = 1;
let idb = null, memOnly = false;
const mem = { projects: new Map(), blobs: new Map() };
function idbOpen() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in self)) return rej(new Error('no indexedDB'));
    let r; try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);

        g.font = '10px system-ui,sans-serif'; g.fillStyle = col('--muted'); g.fillText(f.label.toUpperCase(), c.x + 12, y); y += 14;
        g.font = '14px system-ui,sans-serif'; g.fillStyle = col('--text'); for (const ln of wrapText(g, v, c.w - 24)) { if (y > c.y + c.h) break; g.fillText(ln, c.x + 12, y); y += 18; } y += 6;
      }
    }
    if (c.ink.length && !c.collapsed) { g.save(); g.translate(c.x, c.y); for (const s of c.ink) drawStroke(g, s); g.restore(); }
    g.restore();
  }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await saveFile(`${safeName(P.name)}-canvas-${stamp()}.png`, blob); toast('Exported image');
}

/* ============ boot ============ */
function boot() {
  readTheme(); buildChrome(); setTool('select');
  new ResizeObserver(() => { if (!$('#editor').hidden) resizeInk(); }).observe(vp);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); if (S.P) { redrawInk(); for (const c of S.P.cards) if (c.ink.length) drawCardInk(c); } });
  if (window.visualViewport) { const fix = () => { $('#app').style.height = visualViewport.height + 'px'; window.scrollTo(0, 0); }; visualViewport.addEventListener('resize', fix); visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0)); fix(); }
  document.addEventListener('focusin', e => {
    const f = e.target; if (!S.P || !f.closest || !f.closest('.card')) return;
    setTimeout(() => { const r = f.getBoundingClientRect(), vr = vpRect(), vh = window.visualViewport ? visualViewport.height : innerHeight, lim = Math.min(vr.bottom, vh) - 20; if (r.bottom > lim) { S.P.view.y -= r.bottom - lim + 30; applyView(); } else if (r.top < vr.top + 10) { S.P.view.y += vr.top + 10 - r.top; applyView(); } }, 350);
  });
  window.addEventListener('pagehide', () => { if (S.P && S.dirty) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.P && (S.dirty || S.saveTimer)) saveNow(); });
  window.addEventListener('error', e => console.error('app error', e.message));
  idbOpen().then(db => { idb = db; }, () => { memOnly = true; idb = null; }).then(async () => {
    await renderHome(); showScreen('home'); document.body.dataset.ready = '1';
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(e => console.warn('sw', e));
  });
  window.__storyCanvas = { state: S };
}
boot();
})();
